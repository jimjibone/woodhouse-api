version: '3'

tasks:
  default:
    deps:
      - proto-go-v2

  proto-go-plugins:
    run: when_changed
    status:
      - test -f .bin/protoc-gen-go
      - test -f .bin/protoc-gen-go-grpc
    cmds:
      - mkdir -p .bin
      - go build -o .bin/protoc-gen-go google.golang.org/protobuf/cmd/protoc-gen-go
      - go build -o .bin/protoc-gen-go-grpc google.golang.org/grpc/cmd/protoc-gen-go-grpc

  proto-go-v2:
    run: when_changed
    deps:
      - proto-go-plugins
    sources:
      - ./proto/v2/*/*.proto
    generates:
      - ./go/v2/*/*.pb.go
    cmds:
      - cd proto && protoc --plugin=../.bin/protoc-gen-go -I./v2 --go_out=../go/v2 --go_opt=module=github.com/jimjibone/woodhouse-api/go/v2 ./v2/*/*.proto
      - cd proto && protoc --plugin=../.bin/protoc-gen-go-grpc -I./v2 --go-grpc_out=../go/v2 --go-grpc_opt=module=github.com/jimjibone/woodhouse-api/go/v2 ./v2/*/*_service.proto
